{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body class="admin-body">
    <main class="admin-login-shell">
        <div class="admin-login-box">
            <div class="admin-header-row">
                <span class="status-dot" aria-hidden="true"></span>
                <span>VENDING MACHINE ADMIN</span>
            </div>
            <h1>Administrator login</h1>
            {% if form.errors %}
                <ul class="message-list">
                    <li class="message error">The username or password was not correct.</li>
                </ul>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <label for="id_username">Username</label>
                <input id="id_username" name="username" type="text" autocomplete="username" required>
                <label for="id_password">Password</label>
                <input id="id_password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">LOGIN</button>
            </form>
        </div>
    </main>
</body>
</html>
